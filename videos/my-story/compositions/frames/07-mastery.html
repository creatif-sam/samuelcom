<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');

        #root {
          position: absolute; inset: 0;
          container-type: size;
          color: #0a0908;
          font-family: 'Poppins', sans-serif;
          overflow: hidden;
        }
        .bg-ground {
          position: absolute; inset: 0;
          background: #f0ede8;
        }
        .stage {
          position: absolute; inset: 0;
        }
        .ring {
          position: absolute; left: 42%; top: 50%;
          width: 30cqw; height: 30cqw; border-radius: 50%;
          border: 1px dashed #f2a93b; opacity: 0;
        }
        .ring-solid {
          position: absolute; left: 42%; top: 50%;
          width: 30cqw; height: 30cqw; border-radius: 50%;
          border: 1px solid #f2a93b; opacity: 0;
        }
        .node {
          position: absolute; left: 42%; top: 50%;
          width: 12px; height: 12px; margin: -6px 0 0 -6px;
          border-radius: 50%; background: #546cfa;
          opacity: 0; transform-style: preserve-3d;
        }
        .label {
          position: absolute; left: 62cqw; top: 30cqh;
          font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
          color: #4a5fdd; font-weight: 500; opacity: 0;
        }
        .headline {
          position: absolute; left: 62cqw; top: 38cqh;
          font-size: 2.6cqw; font-weight: 400; line-height: 1.15; max-width: 34cqw;
        }
        .headline .word { display: inline-block; opacity: 0; transform: translateY(0.6em); margin-right: 0.28em; }
        .body {
          position: absolute; left: 62cqw; top: 64cqh;
          font-size: 1.25cqw; color: #5A5A5A; max-width: 32cqw; line-height: 1.5;
          opacity: 0;
        }
      </style>
      <div data-hf-id="hf-g6vq" id="root" data-composition-id="07-mastery" data-width="1920" data-height="1080" data-duration="6.644">
        <div data-hf-id="hf-bg" class="bg-ground clip" data-start="0" data-duration="6.644" data-track-index="0"></div>
        <div data-hf-id="hf-stage" class="stage">
          <div data-hf-id="hf-ringd" class="ring"></div>
          <div data-hf-id="hf-rings" class="ring-solid"></div>
          <div data-hf-id="hf-sr0v" class="node n1"></div>
          <div data-hf-id="hf-hvj8" class="node n2"></div>
          <div data-hf-id="hf-kust" class="node n3"></div>
          <div data-hf-id="hf-1ewq" class="node n4"></div>
          <div data-hf-id="hf-z47j" class="label">Mastery &middot; 2023&ndash;2025</div>
          <div data-hf-id="hf-2bsq" class="headline"></div>
          <div data-hf-id="hf-n21l" class="body">How do groups think, decide, and build &mdash; together?</div>
        </div>
      </div>
      <script>
        window.__timelines = window.__timelines || {};

        // Build per-word headline spans deterministically
        (function () {
          var headline = document.querySelector('.headline');
          var text = "Master's in Collective Intelligence, UM6P.";
          var words = text.split(' ');
          words.forEach(function (w) {
            var span = document.createElement('span');
            span.className = 'word';
            span.textContent = w;
            headline.appendChild(span);
          });
        })();

        var tl = gsap.timeline({ paused: true });

        // Node targets relative to ring (px offsets from ring center)
        var stageW = 1920;
        var ringR = 0.30 * stageW * 0.5; // 30cqw diameter -> radius

        var angles = [ -70, -18, 200, 255 ]; // degrees, spread around ring

        var nodes = gsap.utils.toArray('.node');
        nodes.forEach(function (el, i) {
          var rad = (angles[i] / 360) * Math.PI * 2;
          var x = Math.cos(rad) * ringR;
          var y = Math.sin(rad) * ringR;
          gsap.set(el, {
            x: x, y: y,
            rotateX: -70, rotateY: 45, z: -160,
            scale: 0.3, opacity: 0
          });
          el.__orbitX = x;
          el.__orbitY = y;
        });

        // Scene 1 (0.0-2.5s): label crossfades in, ring present (fades in), nodes still hidden
        tl.to('.label', { opacity: 1, duration: 0.7, ease: 'power1.out' }, 0.15);
        tl.fromTo('.ring', { opacity: 0 }, { opacity: 0.4, duration: 1.0, ease: 'power1.out' }, 0.15);
        tl.fromTo('.ring-solid', { opacity: 0 }, { opacity: 0.25, duration: 1.0, ease: 'power1.out' }, 0.15);

        // Scene 2 (2.5-5.5s): nodes spring in on their own beat (3D flip settle), headline builds per-word
        var nodeStart = 2.5;
        var nodeStagger = 0.22;
        nodes.forEach(function (el, i) {
          tl.to(el, {
            rotateX: 0, rotateY: 0, z: 0,
            scale: 1, opacity: 0.75,
            duration: 0.55,
            ease: 'back.out(1.6)'
          }, nodeStart + i * nodeStagger);
        });

        var words = gsap.utils.toArray('.headline .word');
        var headlineStart = 2.7;
        var wordStagger = 0.11;
        words.forEach(function (w, i) {
          tl.to(w, {
            opacity: 1, y: 0,
            duration: 0.45,
            ease: 'power2.out'
          }, headlineStart + i * wordStagger);
        });

        // Scene 3 (5.5-6.144s): body question reveals, then a faint finite drift on the node ring
        tl.fromTo('.body', {
          opacity: 0, y: 10
        }, {
          opacity: 1, y: 0,
          duration: 0.55,
          ease: 'power2.out'
        }, 5.5);

        var driftStart = 5.75;
        var driftDur = 0.35;
        nodes.forEach(function (el, i) {
          var jx = (i % 2 === 0 ? 1 : -1) * 3;
          var jy = (i < 2 ? -1 : 1) * 2.5;
          tl.to(el, {
            x: el.__orbitX + jx,
            y: el.__orbitY + jy,
            duration: driftDur,
            ease: 'sine.inOut'
          }, driftStart + i * 0.05);
        });

        window.__timelines["07-mastery"] = tl;
      </script>
    </template>
  </body>
</html>
