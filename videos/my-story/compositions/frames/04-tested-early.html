          border: 1px solid #f2a93b;
          border-radius: 50%;
          opacity: 0.28;

          content: "";
          position: absolute;

          border: 1px dashed #f2a93b;
          border-radius: 50%;

          gap: 2.4cqw;
        }
        .stat-wrap {
          position: relative;
          width: 10cqw;
          height: 8.4cqw;
        }
        .stat {
          position: absolute;
          left: 0; top: 0;
          font-size: 8cqw;
          line-height: 1;
          font-weight: 400;
          color: #0a0908;
          transform-origin: left center;

        #stat-in { opacity: 0; }

          display: flex;
          flex-direction: column;

          font-size: 2cqw;
          line-height: 1.15;
        }
        .role-title span, .role-body span {
          display: inline-block;
          opacity: 0;
          transform: translateY(0.5cqw);
        }

          font-size: 1.2cqw;
          color: #5A5A5A;
          max-width: 34cqw;
          line-height: 1.6;
        }
      </style>
      <div data-hf-id="hf-wbr1" id="root" data-composition-id="04-tested-early" data-width="1920" data-height="1080" data-duration="6.665">
        <div data-hf-id="hf-bg1" class="bg"></div>
        <div data-hf-id="hf-rg1" class="ring"></div>
        <div data-hf-id="hf-z209" class="label" id="label">Tested early · 2017</div>
        <div data-hf-id="hf-a46i" class="rule">
          <div data-hf-id="hf-sw1" class="stat-wrap">
            <div data-hf-id="hf-q3qA" class="stat" id="stat-out">10</div>
            <div data-hf-id="hf-q3qB" class="stat" id="stat-in">17</div>
          </div>
          <div data-hf-id="hf-yth4" class="role">
            <div data-hf-id="hf-1bzz" class="role-title" id="role-title">
              <span data-hf-id="hf-ub8l">Managing</span> <span data-hf-id="hf-pzil">Director</span>
            </div>
            <div data-hf-id="hf-4gz0" class="role-body" id="role-body">
              <span data-hf-id="hf-ms68">A</span> <span data-hf-id="hf-lfit">car</span> <span data-hf-id="hf-7mle">wash</span> <span data-hf-id="hf-ogzz">business</span> <span data-hf-id="hf-ftaa">in</span> <span data-hf-id="hf-1j6a">Mpohor</span> <span data-hf-id="hf-53zj">—</span> <span data-hf-id="hf-8o6d">profit,</span> <span data-hf-id="hf-a05q">loss,</span> <span data-hf-id="hf-kyh6">and</span> <span data-hf-id="hf-qjz6">people,</span> <span data-hf-id="hf-mvu2">before</span> <span data-hf-id="hf-r2f6">finishing</span> <span data-hf-id="hf-3tft">school.</span>

          </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const label = document.getElementById("label");
        const statOut = document.getElementById("stat-out");
        const statIn = document.getElementById("stat-in");
        const roleTitleWords = document.querySelectorAll("#role-title span");
        const roleBodyWords = document.querySelectorAll("#role-body span");
        const ring = document.getElementById("hf-rg1") || document.querySelector(".ring");

        // Scene 1 (0.0-2.0s): label crossfades in — continuity, rule already in place, no re-draw.
        tl.fromTo(label, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.15);

        // Scene 2 (2.0-5.5s): stat scale-swap handoff — "10" shrinks+fades out, "17" arrives with a bouncy pop, same screen position.
        tl.to(statOut, { scale: 0.55, opacity: 0, duration: 0.5, ease: "power2.in" }, 2.2);
        tl.fromTo(
          statIn,
          { scale: 0.55, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.65, ease: "back.out(1.6)" },
          2.45
        );

        // Scene 3 (~3.3-5.7s): role title + body reveal via per-word staggered fade-up, timed to "running a business... profit, loss, people."
        gsap.utils.toArray(roleTitleWords).forEach((w, i) => {
          tl.to(w, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.3 + i * 0.12);
        });
        gsap.utils.toArray(roleBodyWords).forEach((w, i) => {
          tl.to(w, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.85 + i * 0.14);
        });

        // Held read from ~5.7s to end: subtle jitter only on the "17" stat figure.
        const IDLE_START = 5.7;
        const IDLE_DUR = Math.max(0.1, 6.165 - IDLE_START);
        const phase = { p: 0 };
        tl.to(
          phase,
          {
            p: Math.PI * 2 * (IDLE_DUR / 2.6),
            duration: IDLE_DUR,
            ease: "none",
            onUpdate: () => {
              const s = 1 + Math.sin(phase.p) * 0.01;
              const y = Math.sin(phase.p) * 2;
              statIn.style.transform = `translateY(${y}px) scale(${s})`;
            },
          },
          IDLE_START
        );

        window.__timelines["04-tested-early"] = tl;
      </script>
