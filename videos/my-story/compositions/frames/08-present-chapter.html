      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-2.0s): label + heading crossfade in together, carried by the
        // push-slide RIGHT transition seam.
        tl.fromTo("#label",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          0.2
        );
        tl.fromTo("#heading",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" },
          0.35
        );

        // Scene 2 (2.0-7.0s): each row reveals on its own spoken clause, strictly
        // one-per-beat via a slide-up crossfade onto its hairline.
        const rows = [
          { row: "#row1", num: "#num1", at: 2.0 },
          { row: "#row2", num: "#num2", at: 3.8 },
          { row: "#row3", num: "#num3", at: 5.6 },
        ];
        rows.forEach(({ row, at }) => {
          tl.fromTo(row,
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
            at
          );
        });

        // Scene 3 (7.0-7.893s): all three rows held, still — subtle jitter only on
        // the numerals.
        const HOLD_START = 7.0;
        const HOLD_DUR = 0.893;
        const nums = rows.map(r => document.querySelector(r.num));
        const phase = { p: 0 };
        tl.to(phase, {
          p: Math.PI * 2 * 0.4,
          duration: HOLD_DUR,
          ease: "none",
          onUpdate: () => {
            nums.forEach((el, i) => {
              const offset = Math.sin(phase.p + i * (Math.PI / 2)) * 0.01;
              const y = Math.sin(phase.p + i * (Math.PI / 2)) * 2;
              el.style.transform = `translateY(${y}px) scale(${1 + offset})`;
            });
          },
        }, HOLD_START);

        window.__timelines["08-present-chapter"] = tl;
      </script>
